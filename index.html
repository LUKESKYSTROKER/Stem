<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyStremio Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/webtorrent@1.9.5/webtorrent.min.js"></script>
  <style>
    body { background: #000; color: #fff; font-family: system-ui; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #111; display: flex; justify-content: space-around; padding: 12px 0; }
    .accent { color: #0085CA; }
  </style>
</head>
<body class="min-h-screen pb-20">

  <div id="main-content" class="p-6 text-center">
    <h1 class="text-4xl font-bold mb-8">MyStremio Test</h1>
    <p class="text-zinc-400 mb-8">Tap a button below to test video playback</p>
  </div>

  <div class="bottom-nav">
    <a onclick="testDirect()" class="accent text-center"><i class="fa-solid fa-play text-3xl"></i><div class="text-xs mt-1">Direct Video</div></a>
    <a onclick="testTorrent()" class="text-center"><i class="fa-solid fa-magnet text-3xl"></i><div class="text-xs mt-1">Torrent Test</div></a>
  </div>

  <div id="player-modal" onclick="if(event.target===this)closePlayer()" class="hidden fixed inset-0 bg-black flex items-center justify-center z-[100]">
    <div class="w-full max-w-5xl px-4">
      <button onclick="closePlayer()" class="text-white text-5xl absolute top-4 right-4">×</button>
      <video id="video-player" class="w-full rounded-3xl" controls autoplay playsinline></video>
      <div id="torrent-info" class="text-center text-sm text-zinc-400 mt-4"></div>
    </div>
  </div>

  <script>
    const client = typeof WebTorrent !== 'undefined' ? new WebTorrent() : null;

    function testDirect() {
      const modal = document.getElementById('player-modal');
      const video = document.getElementById('video-player');
      const info = document.getElementById('torrent-info');
      modal.classList.remove('hidden');
      video.src = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny_320x180_10s_1MB.mp4';
      video.play();
      info.innerHTML = '✅ Direct MP4 test — should play immediately';
    }

    function testTorrent() {
      const modal = document.getElementById('player-modal');
      const video = document.getElementById('video-player');
      const info = document.getElementById('torrent-info');
      modal.classList.remove('hidden');
      info.innerHTML = '🌐 Connecting to torrent peers...<br><small>Keep app open — may take 10-60 seconds</small>';

      const testMagnet = "magnet:?xt=urn:btih:dd8255ecdc7ca55fb0bbf81323d87062db1f6d1c&dn=Big+Buck+Bunny";

      if (client) {
        client.add(testMagnet, (torrent) => {
          info.textContent = `Torrent: ${torrent.name}`;
          const file = torrent.files.find(f => f.name.endsWith('.mp4') || f.name.endsWith('.mkv'));
          if (file) file.renderTo(video, { autoplay: true });
        });
      }
    }

    function closePlayer() {
      const video = document.getElementById('video-player');
      video.pause();
      video.src = '';
      if (client) client.destroy();
      document.getElementById('player-modal').classList.add('hidden');
    }
  </script>
</body>
</html>
